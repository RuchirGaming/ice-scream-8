<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Asset Control Center</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: rgba(22, 29, 49, 0.7);
            --bg-control: #161d31;
            --border-color: rgba(56, 189, 248, 0.15);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-yellow: #fbbf24;
            --accent-green: #10b981;
            --glow: 0 0 15px rgba(56, 189, 248, 0.25);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-main);
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-blue);
        }

        header {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 2rem;
            border-radius: 16px;
            margin-bottom: 2.5rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--glow), inset 0 1px 1px rgba(255, 255, 255, 0.05);
        }
        
        h1 { 
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 1.5rem 0;
        }
        
        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .btn-search-trigger {
            flex: 1;
            min-width: 280px;
            background-color: var(--bg-control);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 0.75rem 1.25rem;
            border-radius: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            transition: var(--transition);
        }
        .btn-search-trigger:hover {
            border-color: var(--accent-blue);
            color: var(--text-main);
            box-shadow: var(--glow);
        }
        .kbd-shortcut {
            background: #334155;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--text-main);
            font-family: monospace;
        }
        
        select, button {
            background-color: var(--bg-control);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.75rem 1.25rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        select:focus { outline: none; border-color: var(--accent-blue); }
        select:hover, button:hover { 
            background-color: #1e293b;
            border-color: rgba(255, 255, 255, 0.2);
        }
        button.active { 
            background-color: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            border-color: var(--accent-blue);
            box-shadow: var(--glow);
        }
        
        .btn-download-all {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            color: white;
            font-weight: 600;
            margin-left: auto;
        }
        .btn-download-all:hover { 
            transform: translateY(-1px);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        .search-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 8, 15, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            padding-top: 10vh;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .search-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .search-modal {
            width: 90%;
            max-width: 650px;
            background: #111827;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), var(--glow);
            display: flex;
            flex-direction: column;
            max-height: 70vh;
            overflow: hidden;
            transform: translateY(-20px);
            transition: transform 0.2s ease;
        }
        .search-overlay.open .search-modal {
            transform: translateY(0);
        }
        .search-modal-header {
            padding: 1.25rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .search-modal-input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 1.2rem;
            outline: none;
        }
        .btn-close-search {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
        }
        .btn-close-search:hover { color: white; }
        
        .search-results-area {
            padding: 1rem;
            overflow-y: auto;
            flex: 1;
        }
        .search-result-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0.75rem 1rem;
            border-radius: 10px;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
        }
        .search-result-item:hover {
            background: rgba(56, 189, 248, 0.08);
            border-color: var(--accent-blue);
        }
        .search-result-meta {
            font-size: 0.75rem;
            color: var(--accent-yellow);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .folder-section { 
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .folder-section:hover {
            border-color: rgba(56, 189, 248, 0.3);
        }
        
        .folder-header {
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(0, 0, 0, 0.15);
        }
        .folder-title-area {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex: 1;
            user-select: none;
        }
        .folder-title { 
            color: var(--accent-yellow); 
            margin: 0; 
            text-transform: capitalize; 
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .toggle-icon { 
            font-size: 0.75rem; 
            color: var(--text-muted); 
            transition: transform 0.2s ease; 
        }
        .folder-section.collapsed .toggle-icon { transform: rotate(-90deg); }
        .folder-section.collapsed .file-container { display: none !important; }
        
        .file-count { font-size: 0.9rem; color: var(--text-muted); font-weight: 400; margin-left: 0.5rem; }
        
        .btn-zip-section {
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            border-radius: 8px;
        }
        .btn-zip-section:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--text-main);
        }

        .file-container.list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 400px;
            overflow-y: auto;
            padding: 1.25rem;
        }
        .file-container.list .file-item {
            background-color: rgba(9, 13, 22, 0.5);
            padding: 0.75rem 1.25rem;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: var(--transition);
        }
        .file-container.list .file-item:hover {
            background-color: rgba(56, 189, 248, 0.04);
            border-color: rgba(56, 189, 248, 0.2);
            transform: translateX(4px);
        }
        
        .file-container.grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
            max-height: 520px;
            overflow-y: auto;
            padding: 1.25rem;
        }
        .file-container.grid .file-item {
            background-color: rgba(9, 13, 22, 0.5);
            padding: 1.25rem;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: var(--transition);
        }
        .file-container.grid .file-item:hover {
            background-color: rgba(56, 189, 248, 0.04);
            border-color: rgba(56, 189, 248, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        a { 
            color: #cbd5e1; 
            text-decoration: none; 
            font-weight: 500; 
            word-break: break-all;
            transition: var(--transition);
        }
        .file-item:hover a { 
            color: var(--accent-blue); 
        }
        
        .file-size { 
            color: var(--text-muted); 
            font-size: 0.8rem; 
            font-family: SFMono-Regular, Consolas, monospace;
            background: rgba(255,255,255,0.05);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.02);
        }
        
        @media (max-width: 768px) {
            body { padding: 1rem; }
            .btn-download-all { margin-left: 0; width: 100%; justify-content: center; }
            .controls { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

    <div id="searchOverlay" class="search-overlay" onclick="closeSearchMenu()">
        <div class="search-modal" onclick="event.stopPropagation()">
            <div class="search-modal-header">
                <span style="color: var(--accent-blue); font-size: 1.2rem;">🔍</span>
                <input type="text" id="modalSearchInput" class="search-modal-input" placeholder="Type a file name or format to search..." autofocus>
                <button class="btn-close-search" onclick="closeSearchMenu()">✕</button>
            </div>
            <div id="searchResultsArea" class="search-results-area">
                <div style="color: var(--text-muted); text-align: center; margin-top: 2rem;">Start typing to search global assets...</div>
            </div>
        </div>
    </div>

    <header>
        <h1>🎮 Game Asset Control Center</h1>
        <div class="controls">
            <div class="btn-search-trigger" onclick="openSearchMenu()">
                <span>🔍 Search files...</span>
                <span class="kbd-shortcut">Ctrl + K</span>
            </div>
            
            <select id="sortSelect">
                <option value="name_asc">🔤 Alphabetical (A-Z)</option>
                <option value="name_desc">🔤 Alphabetical (Z-A)</option>
                <option value="size_desc">💾 Size (Largest First)</option>
                <option value="size_asc">💾 Size (Smallest First)</option>
            </select>

            <button id="listViewBtn" class="active" onclick="setView('list')">☱ List</button>
            <button id="gridViewBtn" onclick="setView('grid')">☲ Grid</button>
            <button class="btn-download-all" id="downloadAllBtn" onclick="downloadFullProject()">⚡ Download Full Project (.ZIP)</button>
        </div>
    </header>

    <div id="content"></div>

        });

        document.getElementById('modalSearchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const resultsArea = document.getElementById('searchResultsArea');
            resultsArea.innerHTML = '';

            if (!query) {
                resultsArea.innerHTML = '<div style="color: var(--text-muted); text-align: center; margin-top: 2rem;">Start typing to search global assets...</div>';
                return;
            }

            let matches = [];
            for (const [folderName, files] of Object.entries(assetData)) {
                files.forEach(file => {
                    if (file.name.toLowerCase().includes(query)) {
                        matches.push({ ...file, folder: folderName });
                    }
                });
            }

            if (matches.length === 0) {
                resultsArea.innerHTML = '<div style="color: var(--text-muted); text-align: center; margin-top: 2rem;">No matching assets found.</div>';
                return;
            }

            matches.slice(0, 50).forEach(match => {
                const item = document.createElement('div');
                item.className = 'search-result-item';
                item.innerHTML = `
                    <div style="display: flex; flex-direction: column; gap: 0.25rem;">
                        <a href="${match.url}" target="_blank">${match.name}</a>
                        <span class="search-result-meta">📦 ${match.folder.replace('_', ' ')}</span>
                    </div>
                    <span class="file-size">${formatSize(match.size)}</span>
                `;
                resultsArea.appendChild(item);
            });
        });

        function setView(viewType) {
            currentView = viewType;
            document.getElementById('listViewBtn').classList.toggle('active', viewType === 'list');
            document.getElementById('gridViewBtn').classList.toggle('active', viewType === 'grid');
            renderDashboard();
        }

        function toggleSection(folderName) {
            sectionStates[folderName] = !sectionStates[folderName];
            renderDashboard();
        }

        function renderDashboard() {
            const sortType = document.getElementById('sortSelect').value;
            const container = document.getElementById('content');
            container.innerHTML = '';

            for (const [folderName, files] of Object.entries(assetData)) {
                let filteredFiles = [...files];

                if (sortType === 'name_asc') filteredFiles.sort((a,b) => a.name.localeCompare(b.name));
                else if (sortType === 'name_desc') filteredFiles.sort((a,b) => b.name.localeCompare(a.name));
                else if (sortType === 'size_desc') filteredFiles.sort((a,b) => b.size - a.size);
                else if (sortType === 'size_asc') filteredFiles.sort((a,b) => a.size - b.size);

                const section = document.createElement('div');
                section.className = `folder-section ${sectionStates[folderName] ? '' : 'collapsed'}`;

                const headerDiv = document.createElement('div');
                headerDiv.className = 'folder-header';

                const titleArea = document.createElement('div');
                titleArea.className = 'folder-title-area';
                titleArea.onclick = () => toggleSection(folderName);
                
                const formattedName = folderName.replace('_', ' ');
                titleArea.innerHTML = `
                    <span class="toggle-icon">${sectionStates[folderName] ? '▼' : '▶'}</span>
                    <h2 class="folder-title">📂 ${formattedName} <span class="file-count">(${filteredFiles.length} files)</span></h2>
                `;

                const actionArea = document.createElement('div');
                const zipBtn = document.createElement('button');
                zipBtn.className = 'btn-zip-section';
                zipBtn.innerText = '📦 Pack Section';
                zipBtn.onclick = (e) => {
                    e.stopPropagation();
                    downloadZipBucket(folderName, filteredFiles);
                };
                
                actionArea.appendChild(zipBtn);
                headerDiv.appendChild(titleArea);
                headerDiv.appendChild(actionArea);
                section.appendChild(headerDiv);

                const fileContainer = document.createElement('div');
                fileContainer.className = `file-container ${currentView}`;

                filteredFiles.forEach(file => {
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    item.innerHTML = `
                        <a href="${file.url}" target="_blank">${file.name}</a>
                        <span class="file-size">${formatSize(file.size)}</span>
                    `;
                    fileContainer.appendChild(item);
                });

                section.appendChild(fileContainer);
                container.appendChild(section);
            }
        }

        async function downloadZipBucket(folderName, filesList) {
            if (filesList.length === 0) return;
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = '⏳ Zipping...';
            btn.disabled = true;

            const zip = new JSZip();
            const folder = zip.folder(folderName);

            for (const file of filesList) {
                try {
                    const response = await fetch(file.url);
                    const blob = await response.blob();
                    folder.file(file.name, blob);
                } catch (e) {}
            }

            zip.generateAsync({ type: 'blob' }).then(function(content) {
                const element = document.createElement('a');
                element.href = URL.createObjectURL(content);
                element.download = `${folderName}_archive.zip`;
                document.body.appendChild(element);
                element.click();
                document.body.removeChild(element);
                btn.innerText = originalText;
                btn.disabled = false;
            });
        }

        async function downloadFullProject() {
            const btn = document.getElementById('downloadAllBtn');
            btn.innerText = '⏳ Compiling Master Archive...';
            btn.disabled = true;

            const zip = new JSZip();

            for (const [folderName, files] of Object.entries(assetData)) {
                const folder = zip.folder(folderName);
                for (const file of files) {
                    try {
                        const response = await fetch(file.url);
                        const blob = await response.blob();
                        folder.file(file.name, blob);
                    } catch(e) {}
                }
            }

            zip.generateAsync({ type: 'blob' }).then(function(content) {
                const element = document.createElement('a');
                element.href = URL.createObjectURL(content);
                element.download = `full_game_extracted_project.zip`;
                document.body.appendChild(element);
                element.click();
                document.body.removeChild(element);
                btn.innerText = '⚡ Download Full Project (.ZIP)';
                btn.disabled = false;
            });
        }

        document.getElementById('sortSelect').addEventListener('change', renderDashboard);
        renderDashboard();
    </script>
</body>
</html>
